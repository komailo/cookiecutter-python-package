---
name: pre-commit

on: pull_request  # yamllint disable-line rule:truthy

jobs:
    pre-commit:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v2
            - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
            - uses: pre-commit/action@v2.0.0
        if: ${{ always() }}
